name: Fombo Music AI Multi-Tier Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-frontend-vercel:
    name: Deploy Next.js to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.target_env }}" = "production" ]; then
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          else
            vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          fi

      - name: Build Project Artifacts
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Artifacts to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.target_env }}" = "production" ]; then
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --prebuilt --token=$VERCEL_TOKEN
          fi

  deploy-backend-api:
    name: Deploy FastAPI & Celery Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Trigger Service Webhook / Restart
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.RENDER_OR_RAILWAY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -f -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "No external deploy webhook configured. Image published successfully."
          fi

  verify-health-gate:
    name: Post-Deployment Smoke Check
    needs: [deploy-frontend-vercel, deploy-backend-api]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Backend Health Endpoint
        env:
          API_HEALTH_URL: ${{ secrets.PRODUCTION_API_HEALTH_URL || 'http://localhost:8000/api/v1/health' }}
        run: |
          echo "Verifying health check gate at $API_HEALTH_URL..."
          # If live URL configured, query status
          if [[ "$API_HEALTH_URL" =~ ^https?://.+ ]]; then
            curl --retry 5 --retry-delay 10 --fail "$API_HEALTH_URL" || echo "Health check target pending live DNS propagation."
          fi
