version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fombo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fombo_music
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fombo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fombo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fombo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/fombo_music
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/fombo_music
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ACE_STEP_SERVICE_URL=${ACE_STEP_SERVICE_URL:-}
      - ACE_STEP_API_TOKEN=${ACE_STEP_API_TOKEN:-}
      - GENERATION_TIMEOUT_SECONDS=${GENERATION_TIMEOUT_SECONDS:-1800}
      - STORAGE_BACKEND=local
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
      - S3_BUCKET_NAME=fombo-music-assets
      - SECRET_KEY=fombo_super_secret_production_key_change_in_env_2026_x89
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage_data

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fombo-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.core.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "generation,stems,audio_processing,cleanup"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/fombo_music
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ACE_STEP_SERVICE_URL=${ACE_STEP_SERVICE_URL:-}
      - ACE_STEP_API_TOKEN=${ACE_STEP_API_TOKEN:-}
      - GENERATION_TIMEOUT_SECONDS=${GENERATION_TIMEOUT_SECONDS:-1800}
      - STORAGE_BACKEND=local
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
    depends_on:
      - redis
      - postgres
    volumes:
      - storage_data:/app/storage_data

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fombo-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fombo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
  storage_data:
